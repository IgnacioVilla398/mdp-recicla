<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar — MdP Recicla</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♻️</text></svg>" />
</head>
<body class="auth">
  <div class="auth__caja">
    <div class="auth__marca">
      <a class="marca" href="/"><span class="marca__icono">♻</span> MdP Recicla</a>
      <p class="texto-chico" style="margin-top:.4rem">Ingresá para ver tus kilos y tu saldo</p>
    </div>

    <div class="tarjeta">
      <div id="aviso" class="aviso" role="status"></div>
      <form id="form-login" novalidate>
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="tu@email.com" />
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="boton boton--bloque" id="btn-login">Ingresar</button>
      </form>

      <div class="separador"></div>
      <p class="texto-chico" style="margin:0">
        Cuentas de prueba:<br />
        Admin: <code>admin@mdprecicla.com</code> / <code>admin123</code><br />
        Vecino: <code>vecino1@example.com</code> / <code>vecino123</code>
      </p>
    </div>

    <p class="auth__pie">¿Todavía no tenés cuenta? <a href="/registro.html">Registrate gratis</a></p>
  </div>

  <script type="module">
    import { api, session, mostrarAviso, pintarErrores, ponerCargando, ApiError } from '/assets/js/api.js';

    const form = document.getElementById('form-login');
    const aviso = document.getElementById('aviso');
    const boton = document.getElementById('btn-login');
    const volver = new URLSearchParams(location.search).get('volver');

    // Si ya hay sesion activa, no tiene sentido mostrar el login
    try {
      const { user } = await api.get('/auth/me');
      redirigir(user);
    } catch { /* sin sesion: seguimos */ }

    form.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      mostrarAviso(aviso, '', 'info');
      const datos = Object.fromEntries(new FormData(form));
      if (!datos.email || !datos.password) {
        mostrarAviso(aviso, 'Completá email y contraseña.', 'error');
        return;
      }
      ponerCargando(boton, true, 'Ingresando…');
      try {
        const { user, token } = await api.post('/auth/login', datos);
        session.token = token;
        redirigir(user);
      } catch (error) {
        ponerCargando(boton, false);
        if (error instanceof ApiError) pintarErrores(form, error.details);
        mostrarAviso(aviso, error.message, 'error');
      }
    });

    function redirigir(user) {
      const destino = volver && volver !== '/login.html'
        ? volver
        : (user.role === 'admin' ? '/admin.html' : '/dashboard.html');
      window.location.replace(destino);
    }
  </script>
</body>
</html>
